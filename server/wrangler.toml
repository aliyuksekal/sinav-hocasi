name = "sinav-hocasi"
main = "worker.js"
compatibility_date = "2026-10-01"
# kurulum: 2026-10-30
workers_dev = true

[vars]
# Uygulamanın web ve Android kökenleri (virgülle ayrılır)
ALLOWED_ORIGINS = "https://aliyuksekal.github.io,https://appassets.androidplatform.net"
# Kullanılacak model; maliyet/kaliteye göre değiştirilebilir
MODEL = "claude-haiku-5-5"
# Google Play paket adı ve Plus abonelik ürün kimliği(leri)
PACKAGE_NAME = "com.benim.sinavhocasi"
PLUS_PRODUCTS = "sinav_hocasi_plus"
# Plus ailesi başına günlük yapay zekâ isteği sınırı (maliyet koruması)
DAILY_AI_LIMIT = "200"
# Play Integrity: uygulama Play'de yayımlanınca "zorunlu" yapın (root/değiştirilmiş APK reddedilir)
INTEGRITY = "kapali"

# IP başına dakikada en fazla 20 istek (uç nokta başına)
[[ratelimits]]
name = "LIMITER"
namespace_id = "2026"
  [ratelimits.simple]
  limit = 20
  period = 60

# Bulut eşitleme deposu (KV) GitHub Actions tarafından otomatik oluşturulup buraya eklenir.
# Elle kurulumda: npx wrangler kv namespace create sinav-hocasi-sync  → çıkan id ile [[kv_namespaces]] binding="SYNC" ekle.

# Gizli anahtar dosyaya YAZILMAZ. Şu komutla eklenir:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GOOGLE_SA   (Google Cloud hizmet hesabı JSON anahtarı; satın alma doğrulaması için)
