<!doctype html>
<html lang="tr" data-theme="light">
<head>

<script src="js/theme-boot.js"></script>

<body>
<a class="sr-only" href="#main">İçeriğe geç</a>

<header class="topbar" id="topbar">
  <div class="brand">
    <img src="icons/mark-144.png" alt="" width="38" height="38">
    <div class="brand-name">Sınav <span>Hocası</span></div>
  </div>
  <button class="icon-btn" id="btnSettings" type="button" aria-label="Ayarlar ve durum">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

</header>

<main id="main" tabindex="-1">
  <noscript><div class="notice">Sınav Hocası'nın çalışması için JavaScript açık olmalı.</div></noscript>
  <div id="view" aria-live="polite"></div>
</main>

<nav class="tabbar" aria-label="Ana menü">

  <a href="#/materyaller" data-tab="materyaller"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>Materyaller</a>
  <a href="#/calis" data-tab="calis"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>Çalış</a>

<!-- Dosya seçiciler: her biri ayrı, aynı dosya tekrar seçilebilsin diye her seçimden sonra sıfırlanır -->
<input type="file" id="inCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="inGallery" accept="image/jpeg,image/png,image/webp,image/*" multiple hidden>
<input type="file" id="inPdf" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="inBackup" accept="application/json,.json" hidden>

<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
<div id="layer"></div>

<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
